apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: data-platform
data:
  # 服务地址（K8s 内部 DNS）
  nacos-host: nacos.data-platform.svc.cluster.local
  nacos-port: "8848"
  redis-host: redis.data-platform.svc.cluster.local
  redis-port: "6379"
  doris-fe-host: doris-fe.data-platform.svc.cluster.local
  doris-fe-port: "9030"
  ds-host: dolphinscheduler.data-platform.svc.cluster.local
  ds-api-port: "12345"
  om-host: openmetadata.data-platform.svc.cluster.local
  om-api-port: "8585"

  # DolphinScheduler 配置
  DS_API_URL: http://dolphinscheduler:12345/dolphinscheduler/api
  DS_PROJECT_CODE: "1"
  DS_WORKER_GROUP: default
  DS_TENANT: default

  # OpenMetadata 配置
  OM_API_URL: http://openmetadata:8585/api

  # JVM 参数
  JAVA_OPTS: "-Xms256m -Xmx512m -XX:MaxMetaspaceSize=256m"
