# ==================== data-gateway (唯一对外暴露) ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-gateway
  namespace: data-platform
  labels:
    app: data-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: data-gateway
  template:
    metadata:
      labels:
        app: data-gateway
    spec:
      containers:
        - name: data-gateway
          image: data-platform/data-gateway:1.0.0
          ports:
            - containerPort: 8601
          env:
            - name: SERVER_ADDRESS
              value: "0.0.0.0"
            - name: SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR
              value: nacos:8848
            - name: SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR
              value: nacos:8848
            - name: SPRING_DATA_REDIS_HOST
              value: redis
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8601
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8601
            initialDelaySeconds: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: data-gateway
  namespace: data-platform
spec:
  type: NodePort
  ports:
    - port: 8601
      targetPort: 8601
      nodePort: 30601
  selector:
    app: data-gateway
---
# ==================== data-auth ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-auth
  namespace: data-platform
  labels:
    app: data-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-auth
  template:
    metadata:
      labels:
        app: data-auth
    spec:
      containers:
        - name: data-auth
          image: data-platform/data-auth:1.0.0
          ports:
            - containerPort: 8603
          env:
            - name: SERVER_ADDRESS
              value: "0.0.0.0"
            - name: SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR
              value: nacos:8848
            - name: SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR
              value: nacos:8848
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://doris-fe:9030/data_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8
            - name: SPRING_DATA_REDIS_HOST
              value: redis
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: data-auth
  namespace: data-platform
spec:
  type: ClusterIP
  ports:
    - port: 8603
  selector:
    app: data-auth
---
# ==================== system-service ====================
apiVersion: apps/v1
kind: Deployment
