  labels:
    app: system-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: system-service
  template:
    metadata:
      labels:
        app: system-service
    spec:
      containers:
        - name: system-service
          image: data-platform/system-service:1.0.0
          ports:
            - containerPort: 8800
          env:
            - name: SERVER_ADDRESS
              value: "0.0.0.0"
            - name: SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR
              value: nacos:8848
            - name: SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR
              value: nacos:8848
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://doris-fe:9030/data_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8
            - name: SPRING_DATA_REDIS_HOST
              value: redis
            - name: DOLPHINSCHEDULER_API_URL
              value: http://dolphinscheduler:12345/dolphinscheduler/api
