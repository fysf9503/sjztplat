# AI 智能数据中台：功能说明

## 1. 平台定位

本项目是面向数据接入、数据开发、数据质量、数据资产治理和任务调度的一体化数据中台。

平台以 Doris 作为分析与结果数据存储，以 OpenMetadata 作为数据资产与血缘中心，以 DolphinScheduler 作为任务调度中心。用户通过统一前端完成数据源配置、任务编排、质量检测、运行追踪和资产检索。

## 2. 核心业务链路

```text
数据源配置 → 连接测试 → 数据接入任务 → Doris 数据表
                                      ↓
质量规则 / 质量任务 → 质量报告 / 不合格明细
                                      ↓
数据开发任务 → DolphinScheduler 调度 → 运行实例与日志
                                      ↓
OpenMetadata 资产、表字段、血缘与影响分析
```

## 3. 功能模块

### 3.1 总览

统一展示数据源、资产、接入任务、开发任务、质量规则、运行成功率和异常任务。总览只聚合状态，具体配置在对应模块完成。

### 3.2 数据资产与检索

- 通过 OpenMetadata 浏览数据源、数据库、表、字段、标签和术语。
- 查看表结构、样例数据、责任人、质量结果和上下游血缘。
- 支持按名称、标签、数据库和负责人检索资产。

### 3.3 数据接入

数据接入负责将数据库或文件数据稳定地同步到 Doris。

- 数据源管理：维护名称、类型、JDBC URL、用户名、密码和附加连接参数。
- 连接测试：保存前验证网络与认证信息，并返回失败原因。
- 接入任务：选择源数据源、源库表、目标 Doris 库表、全量或增量方式、字段映射和写入模式。
- 数据推送：默认以 Doris 为来源，也允许指定其他已纳管数据源作为来源。
- 任务依赖：接入任务可作为开发任务或质量任务的前置依赖。
- 运行记录：查看开始时间、结束时间、读取行数、写入行数、耗时和异常日志。

### 3.4 数据质量

质量模块围绕“规则 → 策略 → 任务 → 报告 → 明细”建立闭环。

- 规则：完整性、唯一性、值域、格式、范围、及时性、自定义 SQL 和跨表规则。
- 检测对象：选择数据源、表和字段；跨表规则可声明主表、关联表与关联条件。
- 策略：将多个规则绑定到一个表或业务主题，并设置严重级别和阈值。
- 任务：手动执行或由 DolphinScheduler 定时执行，支持全量、增量和抽样。
- 报告：按批次查看得分、通过率、问题分布和规则执行结果。
- 不合格明细：对行级规则保存不合格数据，可按权限导出 CSV。

### 3.5 数据开发

数据开发用于创建 SQL 或编排型数据处理任务。

- SQL 工作台：选择已配置数据源，编写、执行并保存 SQL。
- 开发任务：设置任务类型、SQL 内容、目标表、负责人和运行参数。
- 工作流：在可视化画布中编排接入、SQL、质量和通知节点。
- 依赖：支持前置任务、前置接入任务和前置质量任务；上游成功后才允许下游执行。
- 运行实例：查看节点状态、重试次数、日志与失败原因。

### 3.6 调度中心

调度统一由 DolphinScheduler 执行。

- 配置 Cron、时区、优先级、失败策略、最大重跑次数和告警联系人。
- 支持手动运行、暂停、恢复、补数和重跑失败实例。
- 前端保存调度配置后同步到 DolphinScheduler；运行状态与日志回写平台。

### 3.7 数据治理

- OpenMetadata 提供资产目录、标签、术语、负责人和表级/字段级血缘。
- 平台任务保存或发布时上报源表、目标表和字段映射，形成血缘。
- 结构对比发现源表变化，供用户确认后同步目标 Doris 表结构。
- 用户组与资源权限控制数据源、任务、报告和资产的可见范围。

### 3.8 系统管理

提供用户、用户组、项目空间和基础连接配置管理。账号认证由 data-auth 签发 JWT，所有业务接口通过网关鉴权。

## 4. 推荐使用步骤

1. 在“数据接入”中创建数据源并执行连接测试。
2. 配置接入任务，将源表同步到 Doris。
3. 在“数据质量”中选择目标表和字段，建立规则与检测任务。
4. 在“数据开发”中配置加工任务，并将接入与质量任务设为前置依赖。
5. 在“调度中心”设置调度周期、失败重试和告警。
6. 在 OpenMetadata 中检索资产并查看血缘、质量和影响范围。

## 5. 当前实现边界

- OpenMetadata、DolphinScheduler 和 Doris 是独立服务，平台通过 API 或 JDBC 集成，不复制其内部功能。
- 数据建模、数据服务、报表、文档和智能体作为后续扩展域；没有对应后端与前端实现时，不应在页面中宣称已经可用。
- 数据源密码仅用于连接和运行任务，前端不回显明文密码。
