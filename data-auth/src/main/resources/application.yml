server:
  address: 0.0.0.0
  port: 8603

spring:
  application:
    name: data-auth
  config:
    import: optional:nacos:data-auth.yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.81.104:9030/data_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8
    username: root
    password: root
    type: com.alibaba.druid.pool.DruidDataSource
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: 192.168.81.104
      port: 6379
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.81.104:8848
        username: nacos
        password: nacos
      config:
        server-addr: 192.168.81.104:8848
        file-extension: yml
        username: nacos
        password: nacos

# JWT 配置
jwt:
  secret: data-platform-secret-key-must-be-at-least-32-characters-long
  expiration-ms: 86400000  # 24小时

# Persist application logs for local troubleshooting
logging:
  file:
    name: logs/${spring.application.name}.log

